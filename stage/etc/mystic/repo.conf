# Mystic OS package repository.
#
# The first non-comment, non-blank line that starts with http:// or https://
# is the base URL.  pkg fetches <base>/index.tsv and then <base>/<file> for
# each package, so the same layout works for a static host, a directory
# listing (tools/serve-repo.sh) and GitHub release assets.  Nothing here
# assumes a filename that only exists on one of them.
#
# $MYSTIC_REPO overrides this file for a single command:
#     MYSTIC_REPO=http://10.0.2.2:8000 pkg update
#
# Default: the public GitHub release that carries the package assets
# (repo-v1: index.tsv plus one .tar.gz per package).  It is pinned to a tag,
# not "latest", so an unrelated OS release cannot move the package repository
# out from under us; bump the tag when a new package release is published.
# A local development mirror is the host as QEMU user-mode networking exposes
# it; uncomment the line below to use that instead.
# https://github.com/wishyoulive/mystic-os/releases/download/repo-v2
http://10.0.2.2:8000
